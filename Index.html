<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Teste Mercados - Paulo</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f2f2f2; }
header { background: #1a73e8; color: white; padding: 20px; text-align: center; font-size: 1.5em; }
.container { padding: 10px; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
th { background: #1a73e8; color: white; }
button { padding: 5px 10px; margin: 2px; cursor: pointer; }

#balanceBar {
  background: #e8f5e9;
  padding: 12px 20px;
  margin-bottom: 10px;
  border-radius: 6px;
  font-size: 1.2em;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#balanceValue {
  color: #2e7d32;
  font-size: 1.3em;
}
.profit-positive { color: #2e7d32; font-weight: bold; }
.profit-negative { color: #c62828; font-weight: bold; }
.btn-buy {
  background: #2e7d32; color: white; border: none;
  border-radius: 4px; padding: 5px 12px; cursor: pointer;
}
.btn-sell {
  background: #c62828; color: white; border: none;
  border-radius: 4px; padding: 5px 12px; cursor: pointer;
}
.btn-reset {
  background: #f57c00; color: white; border: none;
  border-radius: 4px; padding: 5px 12px; cursor: pointer;
  font-size: 0.8em;
}
h2 {
  margin-top: 30px; color: #333;
  border-bottom: 2px solid #1a73e8; padding-bottom: 5px;
}
#portfolioEmpty { color: #888; font-style: italic; }
</style>
</head>
<body>
<header>App Teste Mercados - Paulo</header>
<div class="container">

  <div id="balanceBar">
    <span>Saldo: <span id="balanceValue">1000.00</span> $</span>
    <button class="btn-reset" onclick="resetWallet()">Reiniciar Carteira</button>
  </div>

  <button onclick="loadData()">Carregar Top 100 Criptos</button>
  <table id="cryptoTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Nome</th>
        <th>Preço (USD)</th>
        <th>Variação 24h (%)</th>
        <th>P/E Simulado</th>
        <th>Comprar</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <h2>A Minha Carteira</h2>
  <table id="portfolioTable">
    <thead>
      <tr>
        <th>Moeda</th>
        <th>Quantidade</th>
        <th>Preço Compra (USD)</th>
        <th>Preço Atual (USD)</th>
        <th>Lucro/Perda (USD)</th>
        <th>Lucro/Perda (%)</th>
        <th>Data Compra</th>
        <th>Ação</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <p id="portfolioEmpty">Ainda não tens posições. Compra criptos acima!</p>

</div>

<script>
// --- Estado global da carteira ---
let walletState = { balance: 1000.00, positions: [] };

// --- Utilitários ---

function escapeHtml(str) {
  const div = document.createElement('div');
  div.appendChild(document.createTextNode(str));
  return div.innerHTML;
}

function validateCoinData(coin) {
  return {
    id: typeof coin.id === 'string' ? coin.id : '',
    name: typeof coin.name === 'string' ? coin.name : 'Desconhecido',
    priceUsd: Number(coin.priceUsd) || 0,
    changePercent24Hr: Number(coin.changePercent24Hr) || 0
  };
}

// --- Persistência (localStorage) ---

function loadWallet() {
  try {
    const stored = localStorage.getItem('marketpulse_wallet');
    if (stored) {
      const parsed = JSON.parse(stored);
      if (typeof parsed.balance === 'number' && Array.isArray(parsed.positions)) {
        walletState = parsed;
        return;
      }
    }
  } catch (e) {
    console.warn('Carteira corrompida, a reiniciar:', e);
  }
  walletState = { balance: 1000.00, positions: [] };
}

function saveWallet() {
  localStorage.setItem('marketpulse_wallet', JSON.stringify(walletState));
}

// --- Renderização ---

function renderBalance() {
  document.getElementById('balanceValue').textContent = walletState.balance.toFixed(2);
}

async function renderPortfolio() {
  const tbody = document.querySelector('#portfolioTable tbody');
  const emptyMsg = document.getElementById('portfolioEmpty');

  if (walletState.positions.length === 0) {
    tbody.innerHTML = '';
    emptyMsg.style.display = 'block';
    return;
  }
  emptyMsg.style.display = 'none';

  // Fetch de preços actuais num único pedido
  const coinIds = [...new Set(walletState.positions.map(p => p.coinId))].join(',');
  let priceMap = {};
  try {
    const resp = await fetch('https://api.coincap.io/v2/assets?ids=' + encodeURIComponent(coinIds));
    if (resp.ok) {
      const json = await resp.json();
      (json?.data ?? []).forEach(c => {
        priceMap[c.id] = Number(c.priceUsd) || 0;
      });
    }
  } catch (e) {
    console.warn('Erro ao buscar preços para carteira:', e);
  }

  tbody.innerHTML = '';
  walletState.positions.forEach((pos, index) => {
    const currentPrice = priceMap[pos.coinId] || 0;
    const costBasis = pos.quantity * pos.buyPrice;
    const currentValue = pos.quantity * currentPrice;
    const plUsd = currentValue - costBasis;
    const plPct = costBasis > 0 ? ((currentValue / costBasis) - 1) * 100 : 0;
    const dateStr = new Date(pos.timestamp).toLocaleDateString('pt-PT');

    const row = document.createElement('tr');

    const cellName = row.insertCell();
    cellName.textContent = pos.coinName;

    const cellQty = row.insertCell();
    cellQty.textContent = pos.quantity.toFixed(6);

    const cellBuyPrice = row.insertCell();
    cellBuyPrice.textContent = pos.buyPrice.toFixed(2);

    const cellCurrentPrice = row.insertCell();
    cellCurrentPrice.textContent = currentPrice > 0 ? currentPrice.toFixed(2) : 'N/A';

    const cellPL = row.insertCell();
    cellPL.textContent = plUsd.toFixed(2);
    cellPL.className = plUsd >= 0 ? 'profit-positive' : 'profit-negative';

    const cellPLpct = row.insertCell();
    cellPLpct.textContent = plPct.toFixed(2) + '%';
    cellPLpct.className = plPct >= 0 ? 'profit-positive' : 'profit-negative';

    const cellDate = row.insertCell();
    cellDate.textContent = dateStr;

    const cellAction = row.insertCell();
    const sellBtn = document.createElement('button');
    sellBtn.textContent = 'Vender';
    sellBtn.className = 'btn-sell';
    sellBtn.addEventListener('click', () => venderCripto(index));
    cellAction.appendChild(sellBtn);

    tbody.appendChild(row);
  });
}

// --- Tabela de mercado (reescrita segura — sem innerHTML para dados da API) ---

async function loadData() {
  const tbody = document.querySelector('#cryptoTable tbody');
  tbody.innerHTML = '<tr><td colspan="6">A carregar...</td></tr>';
  try {
    const response = await fetch('https://api.coincap.io/v2/assets?limit=100');
    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }
    const payload = await response.json();
    const data = payload?.data ?? [];

    tbody.innerHTML = '';
    data.forEach((rawCoin, index) => {
      const coin = validateCoinData(rawCoin);
      const peSimulado = (Math.random() * 50 + 5).toFixed(2);

      const row = document.createElement('tr');

      const cellRank = row.insertCell();
      cellRank.textContent = index + 1;

      const cellName = row.insertCell();
      cellName.textContent = coin.name;

      const cellPrice = row.insertCell();
      cellPrice.textContent = coin.priceUsd.toFixed(2);

      const cellChange = row.insertCell();
      cellChange.textContent = coin.changePercent24Hr.toFixed(2);

      const cellPE = row.insertCell();
      cellPE.textContent = peSimulado;

      const cellBuy = row.insertCell();
      const buyBtn = document.createElement('button');
      buyBtn.textContent = 'Comprar 10$';
      buyBtn.className = 'btn-buy';
      buyBtn.addEventListener('click', () => comprarCripto(coin.id, coin.name, coin.priceUsd));
      cellBuy.appendChild(buyBtn);

      tbody.appendChild(row);
    });
  } catch (error) {
    console.error('Erro ao carregar dados de mercado:', error);
    tbody.innerHTML = '<tr><td colspan="6">Falha ao carregar mercado (endpoint indisponível ou bloqueado).</td></tr>';
  }
}

// --- Operações da carteira ---

function comprarCripto(coinId, coinName, currentPrice) {
  const amount = 10;
  if (walletState.balance < amount) {
    alert('Saldo insuficiente! Tens apenas ' + walletState.balance.toFixed(2) + '$');
    return;
  }
  if (currentPrice <= 0) {
    alert('Preço inválido, não é possível comprar.');
    return;
  }
  const quantity = amount / currentPrice;
  walletState.balance -= amount;
  walletState.positions.push({
    coinId: coinId,
    coinName: coinName,
    quantity: quantity,
    buyPrice: currentPrice,
    timestamp: Date.now()
  });
  saveWallet();
  renderBalance();
  renderPortfolio();
}

async function venderCripto(index) {
  const pos = walletState.positions[index];
  if (!pos) return;
  try {
    const resp = await fetch('https://api.coincap.io/v2/assets/' + encodeURIComponent(pos.coinId));
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const json = await resp.json();
    const currentPrice = Number(json?.data?.priceUsd) || 0;
    if (currentPrice <= 0) {
      alert('Não foi possível obter o preço atual. Tenta novamente.');
      return;
    }
    const saleValue = pos.quantity * currentPrice;
    walletState.balance += saleValue;
    walletState.positions.splice(index, 1);
    saveWallet();
    renderBalance();
    renderPortfolio();
    alert('Vendeste ' + escapeHtml(pos.coinName) + ' por ' + saleValue.toFixed(2) + '$!');
  } catch (e) {
    console.error('Erro ao vender:', e);
    alert('Erro ao vender. Tenta novamente.');
  }
}

function resetWallet() {
  if (confirm('Tens a certeza que queres reiniciar a carteira? Vais perder todas as posições.')) {
    walletState = { balance: 1000.00, positions: [] };
    saveWallet();
    renderBalance();
    renderPortfolio();
  }
}

// --- Inicialização ---
loadWallet();
renderBalance();
renderPortfolio();
</script>
</body>
</html>
