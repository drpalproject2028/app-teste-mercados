<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Teste Mercados - Paulo</title>
<style>
body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f2f2f2; }
header { background: #1a73e8; color: white; padding: 20px; text-align: center; font-size: 1.5em; }
.container { padding: 10px; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
th { background: #1a73e8; color: white; }
button { padding: 5px 10px; margin: 2px; cursor: pointer; }
</style>
</head>
<body>
<header>App Teste Mercados - Paulo</header>
<div class="container">
  <button onclick="loadData()">Carregar Top 100 Criptos</button>
  <table id="cryptoTable">
    <thead>
      <tr>
        <th>#</th>
        <th>Nome</th>
        <th>Preço (USD)</th>
        <th>Variação 24h (%)</th>
        <th>P/E Simulado</th>
        <th>Simular Compra</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</div>

<script>
async function loadData() {
  const tbody = document.querySelector("#cryptoTable tbody");
  tbody.innerHTML = '<tr><td colspan="6">A carregar...</td></tr>';
  try {
    const response = await fetch('https://api.coincap.io/v2/assets?limit=100');
    if (!response.ok) {
      throw new Error(`HTTP ${response.status}`);
    }
    const payload = await response.json();
    const data = payload?.data ?? [];

    tbody.innerHTML = '';
    data.forEach((coin, index) => {
      const price = Number(coin.priceUsd || 0);
      const dailyChange = Number(coin.changePercent24Hr || 0);
      const peSimulado = (Math.random() * 50 + 5).toFixed(2); // Simulação P/E
      const row = document.createElement('tr');
      row.innerHTML = `
        <td>${index+1}</td>
        <td>${coin.name}</td>
        <td>${price.toFixed(2)}</td>
        <td>${dailyChange.toFixed(2)}</td>
        <td>${peSimulado}</td>
        <td><button onclick="simularCompra('${coin.name}', ${price.toFixed(2)})">Comprar 10$</button></td>
      `;
      tbody.appendChild(row);
    });
  } catch (error) {
    console.error('Erro ao carregar dados de mercado:', error);
    tbody.innerHTML = '<tr><td colspan="6">Falha ao carregar mercado (endpoint indisponível ou bloqueado).</td></tr>';
  }
}

function simularCompra(nome, preco) {
  alert('Simulação: compraste 10$ de ' + nome + ' a ' + preco + '$');
}
</script>
</body>
</html>
